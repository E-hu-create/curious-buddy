# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints. Run with `flutter analyze`.
#
# Do not disable rules project-wide to make a check pass. If a single line
# genuinely needs an exception, use `// ignore: rule_name` with a comment
# explaining why.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Catch implicit dynamic casts and untyped inference early; these hide
    # bugs in JSON parsing and platform-channel code.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Forgotten awaits on speech/storage futures cause race conditions.
    unawaited_futures: warning

linter:
  rules:
    # Async safety (voice playback, storage writes).
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    # Type safety.
    avoid_dynamic_calls: true
    # Style consistency.
    prefer_single_quotes: true
    prefer_final_locals: true
    always_declare_return_types: true
    directives_ordering: true

# Additional information: https://dart.dev/tools/analysis
